name: Update Copier template

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: copier-template-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: "kunminghu-v3"
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Copier
        run: python -m pip install "copier>=9.17.2,<10"

      - name: Apply template update
        id: update
        run: |
          copier update --vcs-ref=master --defaults --conflict rej .
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or refresh draft PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch-token: ${{ secrets.COPIER_UPDATE_TOKEN || github.token }}
          branch: automation/copier-template-update
          commit-message: "chore: update Copier template"
          title: "chore: update Copier template"
          draft: true
          body: |
            Automated update generated by `copier update --vcs-ref=master --defaults --conflict rej`.

            Review any `.rej` files for template merge conflicts. PDF validation uses the existing `build-pandoc.yml` workflow.

      - name: Report template update conflicts
        if: steps.update.outputs.conflicts == 'true'
        run: |
          echo "::error::Copier left .rej files; resolve the conflicts in the draft PR."
          exit 1

      - name: Build updated documentation
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run build-pandoc.yml --ref "$UPDATE_BRANCH"
